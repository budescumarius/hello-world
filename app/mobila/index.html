<style>
/* Layout: atelier de lucru — antet lipicios cu totalul mereu vizibil, pașii procesului ca file numerotate, conținut în carduri late; plăcile de debitare desenate la scară. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f5f7f6;
  --ink: #17211e;
  --muted: #5b6965;
  --line: #d3dbd8;
  --accent: #0f5e52;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe7;
  --wood: #d8b07a;
  --wood-2: #c99a5b;
  --wood-ink: #3a2a14;
  --sheet: #e6ebe9;
  --hatch: #b9c4c0;
  --good: #2f7d32;
  --warn: #a15c00;
  --bad: #b3261e;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #172020; --surface-2: #1c2725; --ink: #e4ebe8; --muted: #98a8a3;
    --line: #2b3835; --accent: #4fbfa6; --accent-ink: #06201b; --accent-soft: #1d3a34;
    --wood: #b9925e; --wood-2: #a57d48; --wood-ink: #1d1407; --sheet: #23302d; --hatch: #3a4a46;
    --good: #6cc070; --warn: #e0a24a; --bad: #f08a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #172020; --surface-2: #1c2725; --ink: #e4ebe8; --muted: #98a8a3;
  --line: #2b3835; --accent: #4fbfa6; --accent-ink: #06201b; --accent-soft: #1d3a34;
  --wood: #b9925e; --wood-2: #a57d48; --wood-ink: #1d1407; --sheet: #23302d; --hatch: #3a4a46;
  --good: #6cc070; --warn: #e0a24a; --bad: #f08a80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.projpick { display: flex; gap: 6px; align-items: center; flex: 1 1 220px; min-width: 0; }
.projpick select { flex: 1; min-width: 0; }
.total-pill { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.total-pill b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.total-pill span { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px; border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab i { font-style: normal; font-family: var(--font-mono); font-size: 0.78rem; margin-right: 6px; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] i { color: var(--accent); }
.tab:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

main { max-width: 1180px; margin: 0 auto; padding-block: 18px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h .sp { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.f { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); font-weight: 500; min-width: 0; }
label.f > span { letter-spacing: 0.02em; }
input, select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); padding: 0; }
label.chk { display: inline-flex; gap: 8px; align-items: center; font-size: 0.9rem; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 8px; font-size: 0.85rem; }
.btn.icon { padding: 6px 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.chip.plain { background: var(--surface-2); color: var(--muted); }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th { text-align: left; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 8px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td input, td select { padding: 6px 7px; }
td.r, th.r { text-align: right; }
td .w-xs { width: 62px; } td .w-s { width: 84px; } td .w-m { width: 150px; } td .w-l { min-width: 170px; }
.tot td { font-weight: 700; background: var(--surface-2); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.stat b { font-family: var(--font-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }

.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.sheet-card { display: grid; gap: 6px; min-width: 0; }
.sheet-card .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; }
svg.sheet { width: 100%; height: auto; display: block; border-radius: 4px; }
.sh-bg { fill: url(#hatch); }
.sh-trim { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 18 12; }
.sh-part { fill: var(--wood); stroke: var(--wood-ink); stroke-width: 2.5; }
.sh-part.rot { fill: var(--wood-2); }
.sh-txt { fill: var(--wood-ink); font-family: var(--font-mono); text-anchor: middle; dominant-baseline: middle; }
.hatch-bg { fill: var(--sheet); }
.hatch-ln { stroke: var(--hatch); stroke-width: 6; }

.sumtbl td:first-child { color: var(--muted); }
.sumtbl td.r { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sumtbl tr.big td { font-size: 1.15rem; font-weight: 700; color: var(--ink); font-family: var(--font-display); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.doc { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; display: grid; gap: 16px; max-width: 820px; }
.doc-h { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
.doc-h h1 { font-size: 1.7rem; font-weight: 800; }
.doc table td, .doc table th { padding: 6px 8px; }
.olist { display: grid; }
.olist-h { display: flex; justify-content: space-between; gap: 8px; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.oitem { display: grid; gap: 2px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.oitem-t { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.doc .grand { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); padding-top: 10px; font-family: var(--font-display); }
.doc .grand b { font-size: 1.6rem; }

.sketch-row { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .sketch-row { grid-template-columns: minmax(0, 1fr); } }
.drop { border: 2px dashed var(--line); border-radius: var(--r); background: var(--surface-2); min-height: 220px; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; padding: 12px; color: var(--muted); overflow: hidden; }
.drop img { width: 100%; height: auto; max-height: 460px; object-fit: contain; border-radius: 6px; display: block; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 44px; height: 44px; color: var(--accent); }
.big-total { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 7vw, 3.2rem); color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.v3d { height: clamp(300px, 52vw, 520px); border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); position: relative; touch-action: none; display: grid; }
.v3d canvas { display: block; width: 100% !important; height: 100% !important; }
.v3d .empty { align-self: center; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swatch { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); flex: none; }
.matpick { display: flex; gap: 8px; align-items: center; }
.qa { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.qa b { font-weight: 600; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.clist td input[type="number"] { width: 78px; }
.clist td:first-child { min-width: 150px; }
.err { color: var(--bad); font-size: 0.9rem; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { font-size: 0.85rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }

.modal { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-box { background: var(--surface); border-radius: 12px; width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 18px; display: grid; gap: 14px; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-size: 0.9rem; }

@media (max-width: 520px) {
  .doc { padding: 18px; }
  .total-pill b { font-size: 1.15rem; }
  .sheets { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  body::before, .top { display: none !important; }
  body { background: #fff; }
  body * { visibility: hidden; }
  #offerDoc, #offerDoc * { visibility: visible; }
  #offerDoc { position: absolute; left: 0; top: 0; width: 100%; border: 0; padding: 0; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 3s !important; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="40" class="hatch-bg"/>
      <line x1="0" y1="0" x2="0" y2="40" class="hatch-ln"/>
    </pattern>
  </defs>
</svg>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="2" fill="var(--accent)"/><rect x="6" y="8" width="11" height="16" fill="var(--wood)"/><rect x="19" y="8" width="7" height="7" fill="var(--wood)"/><rect x="19" y="17" width="7" height="7" fill="var(--wood-2)"/></svg>
      Ofertare
    </div>
    <div class="projpick">
      <label for="projSel" class="muted small" style="position:absolute;left:-9999px">Proiect</label>

</header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';
/* Ofertare Mobilier — calcul rapid de ofertă pentru atelier de mobilă:
   corpuri → piese → optimizare debitare plăci → cant → accesorii → manoperă → transport → ofertă client.
   Datele se păstrează local în browser (localStorage) + backup JSON. */

// ---------------------------------------------------------------- Utilitare
const KEY = 'ofertare-mobilier-v1';
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = (v, d = 0) => (Number(v) || 0).toLocaleString('ro-RO', { minimumFractionDigits: d, maximumFractionDigits: d });
const lei = (v, d = 0) => fmt(v, d) + ' lei';
const today = () => new Date().toISOString().slice(0, 10);
const roDate = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
}

// ---------------------------------------------------------------- Date implicite
const TYPES = {
  baza:      { nume: 'Corp bază',      W: 600, H: 720,  D: 560, polite: 1, usi: 1, sertare: 0, y: 100, picioare: true, traverse: true },
  suspendat: { nume: 'Corp suspendat', W: 600, H: 720,  D: 320, polite: 1, usi: 1, sertare: 0, y: 1450, prindere: true },
  lavoar:    { nume: 'Mască lavoar',   W: 800, H: 500,  D: 460, polite: 0, usi: 0, sertare: 2, y: 350, prindere: true, traverse: true, lavoar: true },
  coloana:   { nume: 'Coloană',        W: 600, H: 2100, D: 560, polite: 4, usi: 2, sertare: 0, y: 100, picioare: true },
  dulap:     { nume: 'Dulap haine',    W: 1000, H: 2400, D: 600, polite: 2, usi: 2, sertare: 0, y: 100, picioare: true, bara: true },
  raft:      { nume: 'Raft deschis',   W: 800, H: 1800, D: 300, polite: 4, usi: 0, sertare: 0, y: 0 },
};

function defaultSettings() {
  return {
    firma: { nume: '', tel: '', email: '', adresa: '', cui: '' },
    kerf: 4, trim: 10, cantAdaos: 30,
    rate: 80, pretKm: 2.5, tva: 21, pierdere: 15,
    furnizor: false, debitareMl: 2.5, cantMl: 2,
    cantCorp: 'c04', cantFront: 'c2',
    roundTo: 10, valabil: 15,
    h: { proiect: 2, piesa: 0.1, corp: 1, sertar: 0.5, usa: 0.2, montaj: 0.75 },
  };
}
function defaultMaterials() {
  return [
    { id: 'm_alb', nume: 'PAL Unilin Alb', decor: '', tip: 'PAL', gros: 18, L: 2800, W: 2070, pret: 260, fibra: false, culoare: '#f1f1ec' },
    { id: 'm_stejar', nume: 'PAL Unilin Stejar', decor: '', tip: 'PAL', gros: 18, L: 2800, W: 2070, pret: 340, fibra: true, culoare: '#c49a6c' },
    { id: 'm_antracit', nume: 'PAL Unilin Antracit', decor: '', tip: 'PAL', gros: 18, L: 2800, W: 2070, pret: 300, fibra: false, culoare: '#4a4d50' },
    { id: 'm_hdf', nume: 'HDF alb', decor: '', tip: 'HDF', gros: 3, L: 2800, W: 2070, pret: 75, fibra: false, culoare: '#efefea' },
    { id: 'm_blat', nume: 'Blat bucătărie', decor: '', tip: 'Blat', gros: 38, L: 4100, W: 600, pret: 650, fibra: true, trim: 0, culoare: '#7b5a3c' },
  ];
}
function defaultCants() {
  return [{ id: 'c04', nume: 'Cant ABS 0,4 mm', pret: 1.2 }, { id: 'c2', nume: 'Cant ABS 2 mm', pret: 3.5 }];
}
function defaultCatalog() {
  return [
    { id: 'a_balama', nume: 'Balama aplicată cu amortizor', um: 'buc', pret: 12 },
    { id: 'a_glisiera', nume: 'Glisiere cu bile (pereche)', um: 'set', pret: 38 },
    { id: 'a_maner', nume: 'Mâner 128 mm', um: 'buc', pret: 15 },
    { id: 'a_picior', nume: 'Picior reglabil 100 mm', um: 'buc', pret: 4.5 },

const matById = (id) => S.materials.find((m) => m.id === id);

// ---------------------------------------------------------------- Generator corpuri
function fullSpec(sp) {
  const t = TYPES[sp.tip] || TYPES.baza;
  return {
    tip: sp.tip, nume: sp.nume || '', W: sp.W ?? t.W, H: sp.H ?? t.H, D: sp.D ?? t.D, buc: sp.buc ?? 1,
    polite: sp.polite ?? t.polite, usi: sp.usi ?? (sp.tip === 'raft' ? 0 : t.usi), sertare: sp.sertare ?? t.sertare,
    manere: sp.manere ?? true, bara: sp.bara ?? !!t.bara, oglinda: !!sp.oglinda,
    y: sp.y ?? t.y ?? 0, x: sp.x ?? null, frontH: Array.isArray(sp.frontH) ? sp.frontH.map(num) : null, note: sp.note || '',
    matCorp: sp.matCorp || 'm_alb', matFront: sp.matFront || 'm_stejar', matSpate: sp.matSpate ?? 'm_hdf',
  };
}
function specTitle(sp) { return `${TYPES[sp.tip]?.nume || 'Corp'} ${sp.W}`; }
function hingesFor(h) { return h <= 900 ? 2 : h <= 1500 ? 3 : h <= 2000 ? 4 : 5; }

function genParts(sp) {
  const s = S.settings, mc = matById(sp.matCorp), mf = matById(sp.matFront);
  const t = mc?.gros || 18, n = Math.max(1, sp.buc | 0);
  const W = num(sp.W), H = num(sp.H), D = num(sp.D), inner = W - 2 * t;
  const rotC = !(mc?.fibra), rotF = !(mf?.fibra);
  const cc = s.cantCorp, cf = s.cantFront, out = [];
  const add = (nume, mat, L, Wd, q, eL, eW, cant, rot) => {
    if (q > 0 && L > 0 && Wd > 0) out.push({ id: uid(), nume, mat, L: Math.round(L), W: Math.round(Wd), q: q * n, eL, eW, cant: eL + eW ? cant : '', rot });
  };
  add('Lateral', sp.matCorp, H, D, 2, 1, 0, cc, rotC);
  if (TYPES[sp.tip]?.traverse) {
    add('Fund', sp.matCorp, inner, D, 1, 1, 0, cc, rotC);
    add('Traversă', sp.matCorp, inner, 100, 2, 1, 0, cc, rotC);
  } else {
    add('Blat corp', sp.matCorp, inner, D, 1, 1, 0, cc, rotC);
    add('Fund', sp.matCorp, inner, D, 1, 1, 0, cc, rotC);
  }
  const back = sp.matSpate ? matById(sp.matSpate) : null;
  const shelfD = D - (back ? 20 : 0);
  add('Poliță', sp.matCorp, inner - 2, shelfD, num(sp.polite), 1, 0, cc, rotC);
  if (back) add('Spate', sp.matSpate, H - 4, W - 4, 1, 0, 0, '', !back.fibra);
  const nd = num(sp.sertare) | 0, nu = num(sp.usi) | 0;
  if (nd > 0) {
    const slide = Math.min(600, Math.max(250, Math.floor((D - 30) / 50) * 50)), boxW = inner - 26;
    const cnt = {};
    for (const fh of drawerHeights(sp)) cnt[fh] = (cnt[fh] || 0) + 1;
    for (const [k, c] of Object.entries(cnt)) {
      const fh = +k, boxH = Math.min(250, Math.max(70, fh - 60));
      add('Front sertar', sp.matFront, W - 3, fh, c, 2, 2, cf, rotF);
      add('Lateral sertar', sp.matCorp, slide, boxH, 2 * c, 1, 0, cc, rotC);
      add('Față/spate sertar', sp.matCorp, boxW - 2 * t, boxH, 2 * c, 1, 0, cc, rotC);
      if (back) add('Fund sertar', sp.matSpate, slide, boxW, c, 0, 0, '', !back.fibra);
    }
  } else if (nu > 0) {
    add(nu > 1 ? 'Ușă' : 'Ușă', sp.matFront, H - 3, Math.floor((W - 3 * nu) / nu), nu, 2, 2, cf, rotF);
  }
  return out;
}
function drawerHeights(sp) {
  const nd = num(sp.sertare) | 0, H = num(sp.H);
  const fh = sp.frontH;
  if (Array.isArray(fh) && fh.length === nd && fh.every((v) => v >= 60) && fh.reduce((a, v) => a + v, 0) <= H + 5) return fh.map((v) => Math.round(v));
  return Array(nd).fill(Math.floor((H - 3 * nd) / nd));
}
const doorSize = (sp) => { const nu = num(sp.usi) | 0; return { nu, w: Math.floor((num(sp.W) - 3 * nu) / Math.max(1, nu)), h: num(sp.H) - 3 }; };
function accForSpec(sp) {
  const n = Math.max(1, sp.buc | 0), o = {}, add = (k, q) => { if (q > 0) o[k] = (o[k] || 0) + q * n; };
  const nd = num(sp.sertare) | 0, nu = nd > 0 ? 0 : num(sp.usi) | 0;
  add('a_balama', nu * hingesFor(num(sp.H) - 3));
  add('a_glisiera', nd);
  if (sp.manere) add('a_maner', nu + nd);
  if (TYPES[sp.tip]?.picioare) add('a_picior', num(sp.W) > 900 ? 6 : 4);
  if (TYPES[sp.tip]?.prindere) add('a_prindere', 2);
  if (sp.oglinda && nu) { const d = doorSize(sp); add('a_oglinda', Math.round(nu * d.w * d.h / 1e4) / 100); }
  if (sp.bara) add('a_bara', 1);
  add('a_suport', 4 * num(sp.polite));
  add('a_consum', 1);
  return o;
}
function makeGroup(sp, old) {
  return { id: old?.id || uid(), nume: sp.nume || specTitle(sp), autoName: !sp.nume, spec: sp, parts: genParts(sp) };
}

// ---------------------------------------------------------------- Optimizare debitare (ghilotină)
const optCache = new Map();
const SORTS = [
  (a, b) => b.L * b.W - a.L * a.W,
  (a, b) => Math.max(b.L, b.W) - Math.max(a.L, a.W) || b.L * b.W - a.L * a.W,
  (a, b) => b.L - a.L || b.W - a.W,
  (a, b) => b.W - a.W || b.L - a.L,
  (a, b) => (b.L + b.W) - (a.L + a.W),
];
const SCORES = ['baf', 'bssf', 'blsf'];
const SPLITS = ['sas', 'las', 'h', 'v', 'area'];

function packOnce(items, SW, SH, k, sortFn, score, split) {
  const sheets = [];
  const list = items.slice().sort(sortFn);
  const newSheet = () => ({ free: [{ x: 0, y: 0, w: SW, h: SH }], placed: [], used: 0, cut: 0 });
  const find = (sh, it) => {
    let best = null;
    const ors = it.rot && it.L !== it.W ? [[it.L, it.W, false], [it.W, it.L, true]] : [[it.L, it.W, false]];
    for (let i = 0; i < sh.free.length; i++) {
      const f = sh.free[i];
      for (const [w, h, r] of ors) {
        if (w > f.w || h > f.h) continue;
        const dw = f.w - w, dh = f.h - h;
        const sc = score === 'baf' ? f.w * f.h - w * h : score === 'bssf' ? Math.min(dw, dh) : Math.max(dw, dh);
        const tie = Math.min(dw, dh);
        if (!best || sc < best.sc || (sc === best.sc && tie < best.tie)) best = { i, w, h, r, sc, tie };
      }
    }
    return best;
  };
  for (const it of list) {
    let sh = null, pos = null;
    for (const s of sheets) { pos = find(s, it); if (pos) { sh = s; break; } }
    if (!pos) { sh = newSheet(); sheets.push(sh); pos = find(sh, it); }
    const f = sh.free.splice(pos.i, 1)[0];
    const { w, h } = pos;
    sh.placed.push({ x: f.x, y: f.y, w, h, no: it.no, nume: it.nume, L: it.L, W: it.W, rot: pos.r });
    sh.used += w * h;
    const cw = Math.min(w + k, f.w), ch = Math.min(h + k, f.h), rw = f.w - cw, rh = f.h - ch;
    let horiz;
    if (split === 'h') horiz = true; else if (split === 'v') horiz = false;
    else if (split === 'sas') horiz = rw < rh; else if (split === 'las') horiz = rw >= rh;
    else horiz = (f.w * rh) > (f.h * rw);
    if (horiz) {
      if (rh > 0) { sh.free.push({ x: f.x, y: f.y + ch, w: f.w, h: rh }); sh.cut += f.w; }
      if (rw > 0) { sh.free.push({ x: f.x + cw, y: f.y, w: rw, h: ch }); sh.cut += h; }
    } else {
      if (rw > 0) { sh.free.push({ x: f.x + cw, y: f.y, w: rw, h: f.h }); sh.cut += f.h; }
      if (rh > 0) { sh.free.push({ x: f.x, y: f.y + ch, w: cw, h: rh }); sh.cut += w; }
    }
  }
  return sheets;
}

function optimize(items, m) {
  const k = num(S.settings.kerf), t = trimOf(m);
  const SW = m.L - 2 * t, SH = m.W - 2 * t;
  const key = JSON.stringify([items.map((i) => [i.no, i.L, i.W, i.rot ? 1 : 0]), SW, SH, k]);
  if (optCache.has(key)) return optCache.get(key);
  const ok = [], bad = [];
  for (const i of items) {
    if ((i.L <= SW && i.W <= SH) || (i.rot && i.W <= SW && i.L <= SH)) ok.push(i); else bad.push(i);
  }
  let best = null, bestLast = Infinity;
  if (ok.length) {
    for (const so of SORTS) for (const sc of SCORES) for (const sp of SPLITS) {
      const r = packOnce(ok, SW, SH, k, so, sc, sp);
      const last = r[r.length - 1].used;
      if (!best || r.length < best.length || (r.length === best.length && last < bestLast)) { best = r; bestLast = last; }
    }
  }
  const sheets = (best || []).sort((a, b) => b.used - a.used);
  const trimCut = t > 0 ? 2 * (m.L + m.W) : 0;
  const res = { sheets, unplaced: bad, SW, SH, cut: sheets.reduce((a, sh) => a + sh.cut + trimCut, 0) };
  if (optCache.size > 200) optCache.clear();
  optCache.set(key, res);
  return res;
}

// ---------------------------------------------------------------- Calcul ofertă
function compute(p) {
  const s = S.settings;
  const all = []; let no = 0;
  for (const g of p.groups) for (const pt of g.parts) { no++; all.push({ ...pt, no, grup: g.nume }); }
  const mats = [];
  for (const m of S.materials) {
    const rows = all.filter((x) => x.mat === m.id);
    if (!rows.length) continue;
    const items = [];
    for (const r of rows) for (let i = 0; i < Math.max(0, num(r.q) | 0); i++) items.push({ no: r.no, nume: r.nume, L: num(r.L), W: num(r.W), rot: !!r.rot });
    const opt = optimize(items, m);
    const area = items.reduce((a, i) => a + i.L * i.W, 0) / 1e6;
    const sheetA = m.L * m.W / 1e6;
    const n = opt.sheets.length;
    const costFull = n * num(m.pret);
    const costArea = area * (1 + num(s.pierdere) / 100) * num(m.pret) / sheetA;
    const cost = p.placi === 'suprafata' ? Math.min(costArea, costFull || costArea) : costFull;
    mats.push({ m, rows, items, opt, area, sheetA, n, util: n ? area / (n * sheetA) : 0, waste: n * sheetA - area, cost, costFull, costArea });
  }
  const orphan = all.filter((x) => !matById(x.mat));
  // cant pe tip + decor
  const cmap = new Map();
  for (const r of all) {
    const e = num(r.eL) + num(r.eW);
    if (!e || !r.cant) continue;
    const ml = (num(r.eL) * num(r.L) + num(r.eW) * num(r.W) + e * num(s.cantAdaos)) * num(r.q) / 1000;
    const key = r.cant + '|' + r.mat;
    const o = cmap.get(key) || { cant: cantById(r.cant), m: matById(r.mat), ml: 0 };
    o.ml += ml; cmap.set(key, o);
  }
  const cants = [...cmap.values()].map((o) => ({ ...o, cost: o.ml * num(o.cant?.pret) }));
  const cantMl = cants.reduce((a, c) => a + c.ml, 0);
  const cutMl = mats.reduce((a, x) => a + x.opt.cut, 0) / 1000;
  const furn = s.furnizor ? cutMl * num(s.debitareMl) + cantMl * num(s.cantMl) : 0;
  // accesorii
  const auto = {};
  for (const g of p.groups) if (g.spec) for (const [k, q] of Object.entries(accForSpec(g.spec))) auto[k] = (auto[k] || 0) + q;
  const accAuto = [];
  for (const k of new Set([...Object.keys(auto), ...Object.keys(p.accAdj || {})])) {
    const c = catById(k); if (!c) continue;
    const q = (auto[k] || 0) + num(p.accAdj[k]);
    accAuto.push({ id: k, c, auto: auto[k] || 0, adj: num(p.accAdj[k]), q, cost: q * num(c.pret) });
  }
  const accMan = p.acc.map((a) => ({ ...a, cost: num(a.q) * num(a.pret) }));
  const accCost = accAuto.reduce((a, x) => a + x.cost, 0) + accMan.reduce((a, x) => a + x.cost, 0);

  const placi = mats.reduce((a, x) => a + x.cost, 0);
  const cantCost = cants.reduce((a, c) => a + c.cost, 0);
  const materiale = placi + cantCost + furn;
  const markupAmt = (materiale + accCost) * num(p.markup) / 100;
  const ore = p.labor.reduce((a, l) => a + num(l.h), 0);
  const manopera = ore * num(p.rate);
  const tr = p.transport;
  const transport = num(tr.km) * 2 * num(tr.drumuri) * num(tr.pretKm) + num(tr.fix);
  const brut = materiale + accCost + markupAmt + manopera + transport;
  const disc = brut * num(p.discount) / 100;
  const net = brut - disc;
  const tva = p.tvaOn ? net * num(s.tva) / 100 : 0;
  const ro = num(s.roundTo);
  const total = ro > 0 ? Math.round((net + tva) / ro) * ro : net + tva;
  return { all, mats, orphan, cants, cantMl, cutMl, furn, accAuto, accMan, accCost, placi, cantCost, materiale, markupAmt, ore, manopera, transport, brut, disc, net, tva, total };
}

function estimateHours(p) {
  const h = S.settings.h;
  let corpuri = 0, sertare = 0, usi = 0, piese = 0;
  for (const g of p.groups) {
    for (const pt of g.parts) piese += num(pt.q);
    if (g.spec) {
      const n = Math.max(1, g.spec.buc | 0), nd = num(g.spec.sertare) | 0;
      corpuri += n; sertare += nd * n; usi += nd ? 0 : (num(g.spec.usi) | 0) * n;
    }
  }
  const r = (v) => Math.round(v * 2) / 2;
  const vals = [num(h.proiect), piese * num(h.piesa), corpuri * num(h.corp) + sertare * num(h.sertar) + usi * num(h.usa), corpuri * num(h.montaj)];
  vals.forEach((v, i) => { if (p.labor[i]) p.labor[i].h = r(v); });
  return { corpuri, sertare, usi, piese };
}

// input helpers: data-o = obiect, data-id, data-f = câmp (cu puncte)
function inp(o, id, f, val, opts = {}) {

}
function sel(o, id, f, val, options, opts = {}) {
  const idAttr = `${o}-${id || 'x'}-${f}`.replace(/[^a-zA-Z0-9_-]/g, '_');

}
function chk(o, id, f, val, label, full = true) {

  return `<label class="chk"><input id="${idAttr}" type="checkbox" data-o="${o}" data-id="${id || ''}" data-f="${f}" ${val ? 'checked' : ''} ${full ? 'data-full="1"' : ''}> ${label}</label>`;
}

function groupSummary(g) {

  const sp = g.spec, b = [];
  b.push(`<span class="mono">${sp.W}×${sp.H}×${sp.D}</span>`);
  if ((sp.buc | 0) > 1) b.push(`<span class="chip">× ${sp.buc} buc</span>`);
  if (num(sp.sertare)) b.push(`${sp.sertare} sertare`); else if (num(sp.usi)) b.push(`${sp.usi} ${sp.usi == 1 ? 'ușă' : 'uși'}`);
  if (num(sp.polite)) b.push(`${sp.polite} ${sp.polite == 1 ? 'poliță' : 'polițe'}`);
  return b.join(' · ');
}

function sheetSVG(sh, m, idx, total) {
  const t = trimOf(m);
  let s = `<svg class="sheet" viewBox="-4 -4 ${m.L + 8} ${m.W + 8}" role="img" aria-label="Placa ${idx} din ${total}">`;
  s += `<rect x="0" y="0" width="${m.L}" height="${m.W}" class="sh-bg"/>`;
  if (t > 0) s += `<rect x="${t / 2}" y="${t / 2}" width="${m.L - t}" height="${m.W - t}" class="sh-trim"/>`;
  for (const pc of sh.placed) {
    const x = t + pc.x, y = t + pc.y;
    s += `<rect x="${x}" y="${y}" width="${pc.w}" height="${pc.h}" class="sh-part${pc.rot ? ' rot' : ''}"><title>#${pc.no} ${esc(pc.nume)} ${pc.L}×${pc.W}${pc.rot ? ' (rotită)' : ''}</title></rect>`;
    const dims = `${pc.L}×${pc.W}`;
    const fs = Math.min(pc.h * 0.32, pc.w / (dims.length * 0.62), 90);
    if (fs >= 24) {
      const two = pc.h > fs * 2.6;
      if (two) {
        s += `<text x="${x + pc.w / 2}" y="${y + pc.h / 2 - fs * 0.62}" class="sh-txt" font-size="${fs}" font-weight="600">#${pc.no}</text>`;
        s += `<text x="${x + pc.w / 2}" y="${y + pc.h / 2 + fs * 0.62}" class="sh-txt" font-size="${fs * 0.85}">${dims}</text>`;
      } else s += `<text x="${x + pc.w / 2}" y="${y + pc.h / 2}" class="sh-txt" font-size="${fs}">#${pc.no} · ${dims}</text>`;
    } else if (Math.min(pc.w, pc.h) > 40) {
      s += `<text x="${x + pc.w / 2}" y="${y + pc.h / 2}" class="sh-txt" font-size="${Math.min(pc.w, pc.h) * 0.5}">${pc.no}</text>`;
    }
  }
  return s + '</svg>';
}

      ${C.disc ? `<tr><td>Discount ${fmt(p.discount, 1)}%</td><td class="r">−${lei(C.disc)}</td></tr>` : ''}
      ${p.tvaOn ? `<tr><td>TVA ${fmt(s.tva)}%</td><td class="r">${lei(C.tva)}</td></tr>` : ''}
      <tr class="big"><td>Total${num(s.roundTo) ? ' (rotunjit)' : ''}</td><td class="r">${lei(C.total)}</td></tr>
    </tbody></table></div>
    <div class="grid2">
      ${fld('Plăci în calcul', sel('p', '', 'placi', p.placi, [['intregi', 'Plăci întregi'], ['suprafata', `Suprafață + ${s.pierdere}% pierdere`]], { label: 'Mod calcul plăci' }))}
      ${fld('Adaos la materiale %', inp('p', '', 'markup', p.markup, { type: 'number', full: true, label: 'Adaos' }))}
      ${fld('Discount %', inp('p', '', 'discount', p.discount, { type: 'number', full: true, label: 'Discount' }))}
      ${fld('Avans cerut %', inp('p', '', 'avans', p.avans, { type: 'number', full: true, label: 'Avans' }))}
    </div>
    <div class="row">${chk('p', '', 'tvaOn', p.tvaOn, `Adaugă TVA ${s.tva}%`)} ${chk('p', '', 'detaliat', p.detaliat, 'Arată defalcarea clientului')} ${chk('p', '', 'listaCorpuri', p.listaCorpuri, 'Arată lista de corpuri')}</div>
  </section>`;
  return `<div class="cols">${internal}
    <section class="card print-area">
      <div class="card-h no-print"><h2>Oferta pentru client</h2><span class="sp"></span>

      </div>
      ${offerDoc(p)}
    </section></div>`;
}

function offerLines(p) {
  return p.groups.map((g) => {
    if (g.spec) {
      const sp = g.spec, mc = matById(sp.matCorp), mf = matById(sp.matFront);
      const n = Math.max(1, sp.buc | 0);
      const fr = (num(sp.sertare) ? `${sp.sertare} sertare` : num(sp.usi) ? `${sp.usi} ${sp.usi == 1 ? 'ușă' : 'uși'}${sp.oglinda ? ' cu oglindă' : ''}` : 'deschis');
      return { nume: g.autoName ? TYPES[sp.tip]?.nume || g.nume : g.nume, dim: `${sp.W}×${sp.H}×${sp.D}`, buc: n, det: `${fr}; corp ${matName(mc)}${(num(sp.sertare) || num(sp.usi)) && mf ? ', front ' + matName(mf) : ''}` };
    }
    const mats = [...new Set(g.parts.map((x) => matName(matById(x.mat))).filter(Boolean))].join(', ');
    return { nume: g.nume, dim: '', buc: 1, det: mats };
  });
}

function offerDoc(p) {
  const s = S.settings, f = s.firma;
  const matsUsed = C.mats.map((x) => `${x.m.nume}${x.m.decor ? ' ' + x.m.decor : ''} ${x.m.gros} mm`);
  const mult = 1 - num(p.discount) / 100;
  const matClient = (C.materiale + C.accCost + C.markupAmt) * mult, manClient = C.manopera * mult, trClient = C.transport * mult;
  const lines = offerLines(p);
  const avans = C.total * num(p.avans) / 100;
  return `<article class="doc" id="offerDoc">
    <div class="doc-h">
      <div><h1>Ofertă de preț</h1><div class="muted">${esc(p.nume)}</div></div>
      <div style="text-align:right"><b>${esc(f.nume || 'Atelierul tău (completează în Setări)')}</b><div class="small muted">${[f.tel, f.email, f.adresa, f.cui ? 'CUI ' + f.cui : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
    </div>
    <div class="grid2 small">
      <div><span class="muted">Client</span><br><b>${esc(p.client.nume || '—')}</b>${p.client.tel ? '<br>' + esc(p.client.tel) : ''}${p.client.adresa ? '<br>' + esc(p.client.adresa) : ''}</div>
      <div><span class="muted">Data</span> ${roDate(p.creat)} · valabilă ${s.valabil} zile<br><span class="muted">Termen de execuție</span> ${esc(p.termen || '—')}</div>
    </div>
    ${p.descriere ? `<p style="margin:0">${esc(p.descriere)}</p>` : ''}
    ${p.listaCorpuri && lines.length ? `<div class="olist"><div class="olist-h"><span>Element</span><span>L × H × A mm</span></div>
      ${lines.map((l) => `<div class="oitem"><div class="oitem-t"><b>${esc(l.nume)}${l.buc > 1 ? ` <span class="chip">× ${l.buc}</span>` : ''}</b><span class="mono">${l.dim}</span></div><div class="small muted">${esc(l.det)}</div></div>`).join('')}</div>` : ''}
    ${matsUsed.length ? `<p class="small" style="margin:0"><span class="muted">Materiale:</span> ${matsUsed.map(esc).join(', ')}. Cant ABS pe muchiile vizibile.</p>` : ''}
    ${p.detaliat ? `<table class="sumtbl"><tbody>
      <tr><td>Materiale și accesorii</td><td class="r">${lei(matClient)}</td></tr>
      <tr><td>Manoperă (execuție și montaj)</td><td class="r">${lei(manClient)}</td></tr>
      <tr><td>Transport</td><td class="r">${lei(trClient)}</td></tr>
      ${p.tvaOn ? `<tr><td>TVA ${s.tva}%</td><td class="r">${lei(C.tva)}</td></tr>` : ''}
    </tbody></table>` : ''}
    <div class="grand"><span>Total${p.tvaOn ? ' cu TVA' : ''}</span><b>${lei(C.total)}</b></div>
    ${num(p.avans) ? `<div class="small">Avans la comandă ${fmt(p.avans)}%: <b>${lei(avans)}</b>, restul la montaj.</div>` : ''}
    <div class="small muted">Prețul include materialele, accesoriile, execuția, transportul și montajul. Modificările de proiect după acceptare pot schimba prețul.</div>
  </article>`;
}

function offerText(p) {
  const s = S.settings, f = s.firma, L = [];
  L.push(`OFERTĂ DE PREȚ – ${p.nume}`);
  if (p.client.nume) L.push(`Client: ${p.client.nume}`);
  L.push(`Data: ${roDate(p.creat)} (valabilă ${s.valabil} zile)`);
  if (p.descriere) L.push('', p.descriere);
  if (p.listaCorpuri) {
    const lines = offerLines(p);
    if (lines.length) { L.push('', 'Componență:'); lines.forEach((l) => L.push(`• ${l.nume}${l.dim ? ' ' + l.dim + ' mm' : ''}${l.buc > 1 ? ' × ' + l.buc : ''}${l.det ? ' – ' + l.det : ''}`)); }
  }
  if (C.mats.length) L.push('', 'Materiale: ' + C.mats.map((x) => `${x.m.nume}${x.m.decor ? ' ' + x.m.decor : ''} ${x.m.gros} mm`).join(', '));
  if (p.detaliat) {
    const mult = 1 - num(p.discount) / 100;
    L.push('', `Materiale și accesorii: ${lei((C.materiale + C.accCost + C.markupAmt) * mult)}`, `Manoperă și montaj: ${lei(C.manopera * mult)}`, `Transport: ${lei(C.transport * mult)}`);
    if (p.tvaOn) L.push(`TVA ${s.tva}%: ${lei(C.tva)}`);
  }
  L.push('', `TOTAL${p.tvaOn ? ' cu TVA' : ''}: ${lei(C.total)}`);
  if (num(p.avans)) L.push(`Avans ${fmt(p.avans)}%: ${lei(C.total * num(p.avans) / 100)}`);
  if (p.termen) L.push(`Termen de execuție: ${p.termen}`);
  const sig = [f.nume, f.tel].filter(Boolean).join(' · ');
  if (sig) L.push('', sig);
  return L.join('\n');
}

function textModal(title, text, hint) {
  openModal(`<h2>${esc(title)}</h2>${hint ? `<p class="muted small" style="margin:0">${esc(hint)}</p>` : ''}<textarea id="tm-text" style="min-height:260px" class="mono small">${esc(text)}</textarea>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Închide</button></div>`);
  const ta = $('#tm-text'); ta.focus(); ta.select();
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + ' copiat'); }
  catch { textModal(label, text, 'Selectează tot textul și copiază-l.'); }
}
async function download(name, text, type) {
  if (Cloud.dl) {
    try { await Cloud.dl.save({ filename: name, data: new Blob([text], { type }) }); return; }
    catch (e) { if (e?.code === 'declined' || e?.code === 'rate_limited') return; }
  }
  if (inFrame) { textModal(name, text, 'Copiază textul și salvează-l într-un fișier.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function cutCSV(p) {
  const rows = [['Nr', 'Corp', 'Piesa', 'Material', 'Decor', 'Grosime', 'Lungime', 'Latime', 'Bucati', 'Cant L', 'Cant l', 'Tip cant', 'Rotire']];
  C.all.forEach((x) => { const m = matById(x.mat); rows.push([x.no, x.grup, x.nume, m?.nume || '', m?.decor || '', m?.gros || '', x.L, x.W, x.q, x.eL, x.eW, cantById(x.cant)?.nume || '', x.rot ? 'da' : 'nu']); });
  return rows.map((r) => r.map((v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(';')).join('\n');
}
function importData(text) {
  try {
    const d = JSON.parse(text);
    if (!d || !Array.isArray(d.projects)) throw new Error();
    S = d; migrate(); save(); closeModal(); render(); toast('Backup încărcat');
  } catch { toast('Fișierul nu este un backup valid'); }
}
function confirmModal(msg, act, id) {
  openModal(`<h2>${esc(msg)}</h2><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Renunță</button><button class="btn pri danger" data-act="${act}" data-id="${id || ''}" style="background:var(--bad);border-color:var(--bad);color:#fff">Da, continuă</button></div>`);
}

// ---------------------------------------------------------------- Acțiuni
function findPart(id) { for (const g of cur().groups) { const pt = g.parts.find((x) => x.id === id); if (pt) return { g, pt }; } return {}; }
const A = {
  tab: (el) => { S.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); },
  newProject: () => { const p = newProject(); S.projects.unshift(p); S.current = p.id; S.tab = 'rapid'; save(); render(); toast('Proiect nou: încarcă schița'); },
  openProject: (el) => { S.current = el.dataset.id; save(); render(); },
  dupProject: (el) => {
    const src = S.projects.find((x) => x.id === el.dataset.id); if (!src) return;
    const p = JSON.parse(JSON.stringify(src)); p.id = uid(); p.nume = src.nume + ' (copie)'; p.creat = today(); p.status = 'ciorna';
    S.projects.unshift(p); S.current = p.id; save(); render(); toast('Proiect duplicat');

function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { o[ks[i]] ??= {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }
function targetOf(el) {
  const { o, id } = el.dataset, p = cur();
  switch (o) {
    case 'p': return p;
    case 'set': return S.settings;
    case 'part': return findPart(id).pt;
    case 'group': return p.groups.find((x) => x.id === id);
    case 'acc': return p.acc.find((x) => x.id === id);
    case 'labor': return p.labor.find((x) => x.id === id);
    case 'mat': return S.materials.find((x) => x.id === id);
    case 'cant': return S.cants.find((x) => x.id === id);
    case 'cat': return S.catalog.find((x) => x.id === id);
    case 'adj': return p.accAdj;
    case 'ans': return (p.ai ||= { intrebari: [], raspunsuri: {}, presupuneri: [] }).raspunsuri;
    case 'spec': return p.groups.find((x) => x.id === id)?.spec;
  }
}
function onField(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.o) return;
  const t = targetOf(el); if (!t) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.o === 'mat' && el.dataset.f === 'trim' && v === '') v = '';
  else if (el.type === 'number' || (el.tagName === 'SELECT' && /^(eL|eW)$/.test(el.dataset.f))) v = num(v);
  if (el.dataset.o === 'adj') { t[el.dataset.id] = num(v); }
  else if (el.dataset.o === 'ans') { t[el.dataset.id] = v; }
  else setPath(t, el.dataset.f, v);
  if (el.dataset.o === 'spec') { const g = cur().groups.find((x) => x.id === el.dataset.id); g.parts = genParts(g.spec); if (g.autoName) g.nume = specTitle(g.spec); }
  if (el.dataset.o === 'p' && /^mat(Corp|Front|Spate)$/.test(el.dataset.f)) applyMaterials(cur());
  if (el.dataset.o === 'group' && el.dataset.f === 'nume') t.autoName = false;
  if (el.dataset.o === 'part' && el.dataset.f === 'mat') { const m = matById(v); if (m) t.rot = !m.fibra; }
  save();
  const full = el.dataset.full === '1' || el.tagName === 'SELECT' || el.type === 'checkbox';
  if (e.type === 'change' && full) recalcSoon(true);
  else if (e.type === 'input') recalcSoon(false);
}

function cloudDocs() {
  const cfg = { v: S.v, settings: S.settings, materials: S.materials, cants: S.cants, catalog: S.catalog, current: S.current, tab: S.tab, order: S.projects.map((p) => p.id) };
  return [['cfg', cfg], ...S.projects.map((p) => ['p_' + p.id, p])];

function cloudSync() {
  if (!Cloud.db) return;
  const col = Cloud.db.collection('data/users/' + Cloud.uid);
  const docs = cloudDocs().map(([id, body]) => [id, JSON.stringify(body)]);
  const want = new Set(docs.map((d) => d[0]));
  Cloud.chain = Cloud.chain.then(async () => {
    for (const [id, j] of docs) {
      if (Cloud.last.get(id) === j) continue;
      try { await col.doc(id).set(JSON.parse(j)); Cloud.last.set(id, j); } catch { /* rămâne în browser; reîncearcă la următoarea salvare */ }
    }
    for (const id of [...Cloud.last.keys()]) {
      if (want.has(id)) continue;
      try { await col.doc(id).delete(); Cloud.last.delete(id); } catch { /* ignorat */ }
    }
  });
}
async function initCloud() {
  if (!window.claude?.use) { AI.ready = true; if (S.tab === 'rapid') render(); return; }
  const [db, user, dl, assets, sample] = await Promise.all(['db', 'user', 'downloads', 'assets', 'sample'].map((n) => window.claude.use(n).catch(() => null)));
  Cloud.dl = dl; Cloud.assets = assets;

  AI.ready = true;
  const id = db && user ? await user.id().catch(() => null) : null;
  if (id) {
    try {
      const snap = await db.collection('data/users/' + id).get();
      Cloud.db = db; Cloud.uid = id;
      const cfg = snap.docs.find((d) => d.id === 'cfg' && d.exists);
      if (cfg) {
        const c = JSON.parse(JSON.stringify(cfg.data()));
        const projects = snap.docs.filter((d) => d.exists && d.id.startsWith('p_')).map((d) => JSON.parse(JSON.stringify(d.data())));
        const order = c.order || [];
        projects.sort((a, b) => (order.indexOf(a.id) + 1 || 1e9) - (order.indexOf(b.id) + 1 || 1e9));
        snap.docs.forEach((d) => { if (d.exists) Cloud.last.set(d.id, JSON.stringify(d.data())); });
        delete c.order;
        S = { ...c, projects };
        migrate(); localSave();
      } else cloudSync();
    } catch { /* fără cont: rămânem pe datele din browser */ }
  }
  render();
}

async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob((b) => r(b || file), 'image/jpeg', 0.86));
  } catch { return file; }
}
const sketchURL = (p) => MEM.url[p.id] || (p.sketch?.id ? '/_blob/' + p.sketch.id : '');
async function sketchBlob(p) {
  if (MEM.blob[p.id]) return MEM.blob[p.id];
  if (!p.sketch?.id) return null;
  try { const r = await fetch('/_blob/' + p.sketch.id); if (!r.ok) return null; return (MEM.blob[p.id] = await r.blob()); } catch { return null; }
}
async function setSketch(file) {
  if (!file || !/^image\//.test(file.type)) { toast('Alege o imagine (poză sau captură)'); return; }
  const p = cur(), blob = await shrink(file);
  MEM.blob[p.id] = blob; MEM.url[p.id] = URL.createObjectURL(blob); p.sketch = null;
  render();
  if (Cloud.assets) {
    try { const r = await Cloud.assets.upload(blob); p.sketch = { id: r.id }; save(); } catch { /* schița rămâne doar în sesiunea curentă */ }
  }
  if (AI.sample) aiRun(false);
}

// ---------------------------------------------------------------- Claude citește schița
function aiPrompt(p, refine, withImage) {
  const tipuri = Object.entries(TYPES).map(([k, t]) => `"${k}" = ${t.nume} (uzual ${t.W}×${t.H}×${t.D} mm, la ${t.y} mm de podea)`).join('\n');
  const ai = p.ai || {};
  const ans = [...(ai.istoric || []), ...(ai.intrebari || []).filter((q) => String(ai.raspunsuri?.[q.id] ?? '').trim()).map((q) => ({ intrebare: q.text, raspuns: ai.raspunsuri[q.id] }))];
  const prev = p.groups.filter((g) => g.spec).map((g) => { const sp = g.spec; return { tip: sp.tip, nume: g.nume, W: sp.W, H: sp.H, D: sp.D, buc: sp.buc, usi: sp.usi, sertare: sp.sertare, polite: sp.polite, frontH: sp.frontH, y: sp.y, x: sp.x, oglinda: sp.oglinda, note: sp.note }; });
  return `Ești asistentul unui atelier de mobilă din România. Meșterul a fost la client, a luat măsuri și a făcut o schiță.
${withImage ? 'Imaginea atașată este poza de la client cu schița desenată de mână peste perete: contururile corpurilor și cotele scrise de mână (de obicei în cm; „h” lângă o cotă înseamnă înălțime de la podea; o săgeată orizontală arată o lățime).' : 'Nu există imagine; lucrează doar după descriere.'}
Ce vrea clientul (scris de meșter): "${(p.descriere || '').slice(0, 1500) || '—'}"

Sarcina: identifică fiecare corp de mobilier și dă dimensiunile EXTERIOARE în milimetri, ca să se poată calcula plăcile și prețul.
Tipuri de corp permise:
${tipuri}

Reguli:
- Transformă cm în mm. Dacă o cotă lipsește, alege o valoare uzuală și scrie-o în "presupuneri".
- "y" = de la podea până la baza corpului (mm). "x" = de la capătul din stânga al mobilierului până la marginea stângă a corpului (mm).
- La sertare poți da "frontH" = înălțimile fronturilor, de sus în jos (mm), dacă reies din schiță.
- "oglinda": true dacă ușile par cu oglindă (de ex. dulapul de deasupra lavoarului).
- "note": detalii de execuție scurte (de ex. decupaj pentru sifon).
- Pune cel mult 4 întrebări scurte, doar pentru ce nu reiese din schiță și schimbă dimensiunile sau prețul (de ex. ce înseamnă o cotă neclară). NU întreba de materiale, culori, distanță sau preț — le întreabă aplicația. Dă 2–4 variante scurte de răspuns când se poate.
${refine ? `\nAnaliza ta de până acum:\n${JSON.stringify(prev)}\nRăspunsurile meșterului:\n${JSON.stringify(ans)}\nActualizează corpurile după răspunsuri. Nu mai pune întrebările la care s-a răspuns; pune altele doar dacă sunt cu adevărat necesare.\n` : ''}
Răspunde DOAR cu JSON, exact în forma aceasta (valorile sunt doar exemplu):
{"descriere":"o frază pentru ofertă","corpuri":[{"tip":"suspendat","nume":"Corp suspendat","W":800,"H":700,"D":300,"buc":1,"usi":2,"sertare":0,"polite":1,"frontH":null,"y":1400,"x":0,"oglinda":false,"note":""}],"intrebari":[{"id":"q1","text":"…?","optiuni":["…","…"]}],"presupuneri":["…"]}`;
}
function aiErr(e) {
  switch (e?.code) {
    case 'not_granted': return 'Nu ai permis aplicației să folosească Claude. Poți adăuga corpurile manual.';
    case 'rate_limited': return 'Prea multe cereri într-un timp scurt. Încearcă din nou peste un minut.';
    case 'invalid_json': return 'Claude nu a dat un răspuns pe care să-l pot citi. Apasă din nou „Citește schița”.';
    case 'image_rejected': return 'Imaginea nu a fost acceptată. Încearcă o poză JPG sau PNG.';
    case 'empty': return 'Nu am găsit corpuri în schiță. Scrie pe scurt ce vrea clientul și încearcă din nou.';
    default: return 'Citirea schiței nu a mers' + (e?.message ? ': ' + e.message : '.') + ' Încearcă din nou.';
  }
}
async function aiRun(refine) {
  const p = cur();
  if (!AI.sample || AI.busy) return;
  const blob = await sketchBlob(p);
  if (!blob && !(p.descriere || '').trim()) { toast('Încarcă poza schiței sau scrie ce vrea clientul'); return; }
  const withImage = !!(blob && AI.images);
  AI.busy = true; AI.err = ''; AI.status = refine ? 'Claude reface estimarea după răspunsurile tale…' : 'Claude citește schița și face prima estimare…';
  render();
  try {
    const opts = { modelTier: 'complex', cache: false };
    if (withImage) opts.images = [blob];
    const res = await AI.sample.json(aiPrompt(p, refine, withImage), opts);
    applyAI(p, res, refine);
    toast(refine ? 'Estimare actualizată' : 'Prima estimare e gata');
  } catch (e) { AI.err = aiErr(e); }
  AI.busy = false; AI.status = '';
  save(); render();
}
function applyAI(p, res, refine) {
  const list = Array.isArray(res?.corpuri) ? res.corpuri : [];
  if (!list.length) throw { code: 'empty' };
  const cl = (v, a, b, d) => { if (v === null || v === undefined || v === '') return d; const n = num(v); return Math.min(b, Math.max(a, Math.round(n))); };
  const specs = list.slice(0, 30).map((c) => {
    const tip = TYPES[c?.tip] ? c.tip : 'baza', t = TYPES[tip];
    return fullSpec({
      tip, nume: String(c.nume || '').slice(0, 60),
      W: cl(c.W, 100, 4000, t.W), H: cl(c.H, 100, 3000, t.H), D: cl(c.D, 100, 1000, t.D), buc: cl(c.buc, 1, 20, 1),
      usi: cl(c.usi, 0, 8, t.usi), sertare: cl(c.sertare, 0, 10, t.sertare), polite: cl(c.polite, 0, 12, t.polite),
      frontH: Array.isArray(c.frontH) ? c.frontH.map(num) : null, y: cl(c.y, 0, 2800, t.y), x: cl(c.x, 0, 10000, null),
      oglinda: !!c.oglinda, note: String(c.note || '').slice(0, 200),
      matCorp: p.matCorp, matFront: p.matFront, matSpate: p.matSpate,
    });
  });
  const old = p.ai || {};
  const answered = (old.intrebari || []).filter((q) => String(old.raspunsuri?.[q.id] ?? '').trim()).map((q) => ({ intrebare: q.text, raspuns: old.raspunsuri[q.id] }));
  p.groups = [...specs.map((sp) => makeGroup(sp)), ...p.groups.filter((g) => !g.spec)];
  p.ai = {
    descriere: String(res.descriere || '').slice(0, 400),
    intrebari: (Array.isArray(res.intrebari) ? res.intrebari : []).slice(0, 5).map((q, i) => ({ id: 'q' + Date.now().toString(36) + i, text: String(q?.text || '').slice(0, 300), optiuni: Array.isArray(q?.optiuni) ? q.optiuni.slice(0, 5).map((o) => String(o).slice(0, 80)) : [] })).filter((q) => q.text),
    raspunsuri: {},
    presupuneri: (Array.isArray(res.presupuneri) ? res.presupuneri : []).slice(0, 8).map((x) => String(x).slice(0, 300)),
    istoric: refine ? [...(old.istoric || []), ...answered] : [],
  };
  if (!(p.descriere || '').trim() && p.ai.descriere) p.descriere = p.ai.descriere;
  estimateHours(p);
}
function applyMaterials(p) {
  for (const g of p.groups) if (g.spec) { g.spec.matCorp = p.matCorp; g.spec.matFront = p.matFront; g.spec.matSpate = p.matSpate; g.parts = genParts(g.spec); }
}
