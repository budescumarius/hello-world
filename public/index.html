<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timberway — Mobilier sur mesure & menuiserie</title>
  <meta name="description" content="Timberway : mobilier sur mesure, cuisines, escaliers, parquet et restauration du bois. Maatmeubelen en schrijnwerk. Bespoke furniture and joinery — Asse / Vilvoorde, Belgique.">
  <meta name="theme-color" content="#2b1d12">
  <link rel="alternate" hreflang="fr" href="/?lang=fr">
  <link rel="alternate" hreflang="nl" href="/?lang=nl">
  <link rel="alternate" hreflang="en" href="/?lang=en">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="home">
  <a class="skip" href="#main">Skip</a>

  <header class="header">
    <div class="container">
      <a class="brand" href="#top"><img class="brand-mark" src="/img/logo.svg" alt=""><span class="brand-name" data-setting="companyName">Timberway</span></a>
      <nav class="nav" aria-label="Main">
        <a href="#services" data-i18n="nav.services">Diensten</a>
        <a href="#projects" data-i18n="nav.projects">Realisaties</a>
        <a href="#process" data-i18n="nav.process">Werkwijze</a>
        <a href="#about" data-i18n="nav.about">Over ons</a>
        <a href="#faq" data-i18n="nav.faq">FAQ</a>
        <a href="#contact" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="fr">FR</button><button type="button" data-lang="nl">NL</button><button type="button" data-lang="en">EN</button>
        </div>
        <a class="btn btn-primary header-quote" href="#contact" data-i18n="cta.quote.short">Gratis offerte</a>
        <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu"><span></span></button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu">
    <a class="link" href="#services" data-i18n="nav.services">Diensten</a>
    <a class="link" href="#projects" data-i18n="nav.projects">Realisaties</a>
    <a class="link" href="#process" data-i18n="nav.process">Werkwijze</a>
    <a class="link" href="#about" data-i18n="nav.about">Over ons</a>
    <a class="link" href="#faq" data-i18n="nav.faq">FAQ</a>
    <a class="link" href="#contact" data-i18n="nav.contact">Contact</a>
    <a class="btn btn-primary" href="#contact" data-i18n="cta.quote"></a>
    <a class="btn btn-ghost" data-tel href="#"><span data-i18n="cta.call"></span>&nbsp;·&nbsp;<span data-setting="phone"></span></a>
  </div>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="container">
        <span class="kicker" data-i18n="hero.kicker"></span>
        <h1 data-i18n-html="hero.title"></h1>
        <p data-i18n="hero.text"></p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#contact" data-i18n="cta.quote"></a>
          <a class="btn btn-ghost" href="#projects" data-i18n="cta.projects"></a>
        </div>
        <div class="stats">
          <div class="stat"><strong data-i18n="facts.1.t"></strong><span data-i18n="facts.1.d"></span></div>
          <div class="stat"><strong data-i18n="facts.2.t"></strong><span data-i18n="facts.2.d"></span></div>
          <div class="stat"><strong data-i18n="facts.3.t"></strong><span data-i18n="facts.3.d"></span></div>
        </div>
      </div>
    </section>

    <section class="section" id="services">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="services.kicker"></span>
          <h2 data-i18n="services.title"></h2>
        </div>
        <div class="grid grid-2 grid-3" id="services-grid"></div>
      </div>
    </section>

    <section class="section section-dark section-photo" style="--bg:url('/img/atelier-2.jpg')">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="why.kicker"></span>
          <h2 data-i18n="why.title"></h2>
        </div>
        <div class="grid grid-2 grid-4">
          <div class="why-item reveal"><h3 data-i18n="why.1.t"></h3><p data-i18n="why.1.d"></p></div>
          <div class="why-item reveal"><h3 data-i18n="why.2.t"></h3><p data-i18n="why.2.d"></p></div>
          <div class="why-item reveal"><h3 data-i18n="why.3.t"></h3><p data-i18n="why.3.d"></p></div>
          <div class="why-item reveal"><h3 data-i18n="why.4.t"></h3><p data-i18n="why.4.d"></p></div>
        </div>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="projects.kicker"></span>
          <h2 data-i18n="projects.title"></h2>
        </div>
        <div class="filters" id="filters" role="group"></div>
        <div class="grid grid-2 grid-3" id="projects-grid"></div>
      </div>
    </section>

    <section class="section section-alt" id="process">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="process.kicker"></span>
          <h2 data-i18n="process.title"></h2>
        </div>
        <div class="grid grid-3 steps">
          <div class="step reveal"><h3 data-i18n="process.1.t"></h3><p data-i18n="process.1.d"></p></div>
          <div class="step reveal"><h3 data-i18n="process.2.t"></h3><p data-i18n="process.2.d"></p></div>
          <div class="step reveal"><h3 data-i18n="process.3.t"></h3><p data-i18n="process.3.d"></p></div>
        </div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="container split">
        <div class="about-visual reveal"><img src="/img/atelier-1.jpg" alt="Atelier Timberway" loading="lazy"></div>
        <div class="reveal">
          <span class="kicker" data-i18n="about.kicker"></span>
          <h2 data-i18n="about.title"></h2>
          <p data-i18n="about.text1"></p>
          <p class="muted" data-i18n="about.text2"></p>
          <ul class="checklist">
            <li data-i18n="about.p1"></li><li data-i18n="about.p2"></li><li data-i18n="about.p3"></li><li data-i18n="about.p4"></li>
          </ul>
          <div class="founder" data-if="founder"><strong data-setting="founder"></strong><span data-i18n="about.role"></span></div>
        </div>
      </div>
    </section>

    <section class="section section-alt" id="faq">
      <div class="container" style="max-width:820px">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="faq.kicker"></span>
          <h2 data-i18n="faq.title"></h2>
        </div>
        <div class="faq reveal">
          <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
          <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
          <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
          <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
        </div>
      </div>
    </section>

    <section class="section section-dark" id="contact">
      <div class="container split">
        <div class="reveal">
          <span class="kicker" data-i18n="contact.kicker"></span>
          <h2 data-i18n="contact.title"></h2>
          <p style="opacity:.85" data-i18n="contact.text"></p>
          <div class="contact-info">
            <a data-tel href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span><small data-i18n="contact.phone"></small><span data-setting="phone"></span></span></a>
            <a data-mailto href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg><span><small data-i18n="contact.email"></small><span data-setting="email"></span></span></a>
            <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg><span><small data-i18n="contact.address"></small><span data-setting="address"></span></span></div>
            <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span><small data-i18n="contact.hours"></small><span data-setting="hours"></span></span></div>
          </div>
        </div>
        <div class="contact-card reveal">
          <form id="contact-form" novalidate>
            <div class="field"><label for="f-name" data-i18n="form.name"></label><input id="f-name" name="name" autocomplete="name" required></div>
            <div class="grid grid-2" style="gap:0 12px">
              <div class="field"><label for="f-email" data-i18n="form.email"></label><input id="f-email" name="email" type="email" autocomplete="email" inputmode="email"></div>
              <div class="field"><label for="f-phone" data-i18n="form.phone"></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
            </div>
            <div class="field"><label for="f-service" data-i18n="form.service"></label><select id="f-service" name="service"></select></div>
            <div class="field"><label for="f-msg" data-i18n="form.message"></label><textarea id="f-msg" name="message" required></textarea></div>
            <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button class="btn btn-primary" style="width:100%" type="submit" data-i18n="form.send"></button>
            <div class="form-status" id="form-status" role="status"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <a class="brand" href="#top"><img class="brand-mark" src="/img/logo.svg" alt=""><span data-setting="companyName"></span></a>
          <p style="margin-top:12px" data-setting="tagline"></p>
          <div class="socials">
            <a data-social="facebook" hidden href="#" aria-label="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H8v4h2v8h4v-8h3l1-4h-4V8z"/></svg></a>
            <a data-social="instagram" hidden href="#" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
          </div>
        </div>
        <div>
          <p><a href="#services" data-i18n="nav.services"></a><br><a href="#projects" data-i18n="nav.projects"></a><br><a href="#process" data-i18n="nav.process"></a><br><a href="#about" data-i18n="nav.about"></a></p>
        </div>
        <div>
          <p><a data-tel href="#" data-setting="phone"></a><br><a data-mailto href="#" data-setting="email"></a><br><span data-setting="address"></span><br><span data-setting="hours"></span></p>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span data-year></span> <span data-setting="companyName"></span> · <span data-i18n="footer.rights"></span></span>
        <span><span data-if="vat"><span data-i18n="footer.vat"></span> <span data-setting="vat"></span> · </span><a href="/admin" data-i18n="footer.admin"></a></span>
      </div>
    </div>
  </footer>

  <nav class="action-bar" aria-label="Quick actions">
    <a class="btn btn-ghost" data-tel href="#" data-i18n="cta.call"></a>
    <a class="btn btn-wa" data-wa hidden href="#" target="_blank" rel="noopener" data-i18n="cta.whatsapp"></a>
    <a class="btn btn-primary" href="#contact" data-i18n="cta.quote.short"></a>
  </nav>

  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
